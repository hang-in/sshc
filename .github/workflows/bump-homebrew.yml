name: bump-homebrew

on:
  release:
    types: [published]   # fires after release.yml has uploaded the assets

permissions: {}          # the action uses HOMEBREW_TAP_TOKEN, not GITHUB_TOKEN

jobs:
  bump:
    name: Bump sshc formula in hang-in/homebrew-tap
    runs-on: ubuntu-latest
    # Skip pre-releases — only stable tags should bump the formula.
    if: github.event.release.prerelease == false && github.event.release.draft == false
    steps:
      - name: Update Formula/sshc.rb in tap
        uses: mislav/bump-homebrew-formula-action@v3
        with:
          formula-name: sshc
          formula-path: Formula/sshc.rb
          homebrew-tap: ${{ github.repository_owner }}/homebrew-tap
          # Pre-built binaries live in this release's assets. The
          # action computes sha256 by downloading the macOS arm64
          # tarball; the other URLs reuse the same version string.
          download-url: https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/sshc-aarch64-apple-darwin.tar.gz
          commit-message: |
            sshc {{version}}

            Created by https://github.com/mislav/bump-homebrew-formula-action
        env:
          # PAT with `repo` write to ${{ github.repository_owner }}/homebrew-tap.
          # Stored as a repo secret on hang-in/sshc.
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
