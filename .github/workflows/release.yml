name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # required to upload release assets

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-13
            cross: false
          - target: aarch64-apple-darwin
            os: macos-14
            cross: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # cross-compile only needs the aarch64 GNU linker on x86 Ubuntu.
      - name: Install aarch64 cross linker
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          {
            echo '[target.aarch64-unknown-linux-gnu]'
            echo 'linker = "aarch64-linux-gnu-gcc"'
          } >> .cargo/config.toml

      - name: cargo build --release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Strip binary
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/sshc"
          if [ "${{ matrix.cross }}" = "true" ]; then
            aarch64-linux-gnu-strip "$BIN"
          else
            strip "$BIN" || true
          fi

      - name: Pack tarball
        shell: bash
        run: |
          STAGE="$(mktemp -d)"
          BIN="target/${{ matrix.target }}/release/sshc"
          cp "$BIN" "$STAGE/sshc"
          cp LICENSE "$STAGE/" 2>/dev/null || true
          cp README.md "$STAGE/" 2>/dev/null || true
          (cd "$STAGE" && tar -czf "$GITHUB_WORKSPACE/sshc-${{ matrix.target }}.tar.gz" sshc $(ls *.md *.txt LICENSE 2>/dev/null || true))
          shasum -a 256 "sshc-${{ matrix.target }}.tar.gz"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: sshc-${{ matrix.target }}.tar.gz
          fail_on_unmatched_files: true
          # the bump-homebrew workflow uses the GitHub release event,
          # which fires once the release is "published" — uploading
          # multiple assets to the same release is safe (each job
          # appends).
