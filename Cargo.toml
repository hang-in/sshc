[package]
name = "sshc"
version = "0.8.2"
edition = "2021"
description = "Minimal TUI for managing and connecting to SSH hosts defined in ~/.ssh/config"
license = "MIT"
repository = "https://github.com/hang-in/sshc"
homepage = "https://github.com/hang-in/sshc"
readme = "README.md"

[lib]
path = "src/lib.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
nucleo = "0.5"
dirs = "6"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
# Sync HTTP client for `sshc --doctor`'s update-availability check.
# Default features pull in `rustls` + webpki-roots: bundled Mozilla
# trust store, single static binary, no OpenSSL / SChannel /
# SecureTransport dependency at install time. We tried
# `default-features = false, features = ["native-tls"]` first but
# ureq 2.12 ships without an active TLS backend in that combo,
# causing `--doctor`'s update check to fail with "no TLS backend
# is configured".
ureq = "2.10"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[dev-dependencies]
assert_fs = "1.1"
predicates = "3.1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
