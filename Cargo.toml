[package]
name = "sshc"
version = "0.12.0"
edition = "2021"
description = "Minimal TUI for managing and connecting to SSH hosts defined in ~/.ssh/config"
license = "MIT"
repository = "https://github.com/hang-in/sshc"
homepage = "https://github.com/hang-in/sshc"
readme = "README.md"

[lib]
path = "src/lib.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
nucleo = "0.5"
dirs = "6"
anyhow = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
# Sync HTTP client for `sshc --doctor`'s update-availability check.
# v0.9 G7: switched off the default `tls` feature (rustls + webpki-
# roots) and pair ureq with system-level `native-tls` wired
# explicitly through AgentBuilder::tls_connector. v0.8 R6's failed
# attempt at the same combo flipped *only* the feature bit and got
# "no TLS backend is configured" at runtime — the missing step was
# the explicit `tls_connector` call below in src/doctor.rs.
# Saves ~1.5 MB vs rustls + webpki-roots on macOS arm64; SChannel /
# SecureTransport / OpenSSL are already on every supported host.
ureq = { version = "2.10", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
# Cross-platform clipboard for the `c` key (copy ssh command).
# Wraps Cocoa on macOS, X11/Wayland on Linux, OpenClipboard on Windows.
# v0.10 G2: `default-features = false` strips the `image-data` feature
# (and its image/tiff/PNG-decoder transitive deps) since sshc never
# reads or writes images on the clipboard — text only. wayland-data-control
# stays opt-in via the explicit feature so Wayland users still get the
# fast path; OSC 52 (v0.10 G3) catches the rest.
arboard = { version = "3", default-features = false, features = [
    "wayland-data-control",
] }
# Base64 encoder for the OSC 52 clipboard fallback (v0.10 G3). Used
# only by `src/exec/clipboard.rs`; no transitive surface elsewhere.
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[dev-dependencies]
assert_fs = "1.1"
predicates = "3.1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
