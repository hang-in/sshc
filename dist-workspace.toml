[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# Allow .github/workflows/release.yml to differ from the autogenerated
# template. We hand-edit it to add a workflow-level `concurrency`
# block (see the MANUAL EDIT comment near the top) — without this,
# `dist plan` fails the run with "out of date contents and needs to
# be regenerated". v0.7.2 had two concurrent Release workflow runs
# fire against the same tag; the concurrency guard fixes that, and
# `allow-dirty = ["ci"]` lets cargo-dist tolerate the diff.
allow-dirty = ["ci"]
# CI backends to support
ci = "github"
# The installers to generate for each app. `powershell` is the Windows
# analog of the `shell` installer — an `irm | iex` one-liner.
installers = ["shell", "powershell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
    "aarch64-apple-darwin",
    "aarch64-pc-windows-msvc",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# A GitHub repo to push Homebrew formulas to
tap = "hang-in/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
